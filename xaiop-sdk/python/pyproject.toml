[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaiop"
version = "0.15.0a1"
description = "XAIOP Python SDK — official SDK alpha (wire 0.6.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XAIOP Contributors" }]
keywords = ["xaiop", "llm", "structured-output", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
http = ["httpx>=0.27"]
ws = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/AboutUip/XAIOP"
Documentation = "https://github.com/AboutUip/XAIOP/tree/main/docs/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
