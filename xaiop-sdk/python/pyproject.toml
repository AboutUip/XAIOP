[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaiop"
version = "0.16.0"
description = "XAIOP Python SDK — official product SDK (wire 0.7.0 Draft)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "XAIOP Contributors" }]
keywords = ["xaiop", "llm", "structured-output", "protocol"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
http = ["httpx>=0.27"]
ws = ["websockets>=12.0"]

[project.urls]
Homepage = "https://github.com/AboutUip/XAIOP"
Documentation = "https://github.com/AboutUip/XAIOP/tree/main/docs/sdk/python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xaiop = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
